<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>303 班級聯絡簿</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@600&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>

  :root {
    --paper: #FBF7EF;
    --line: #DAD3C0;
    --ink: #2D3A5C;
    --ink-soft: #6B7280;
    --coral: #FF8B5E;
    --sage: #7FA890;
    --card: #FFFFFF;
    --board: #1F3A2E;
    --board-dark: #16281F;
    --wood: #7A4B2C;
    --wood-dark: #5C3720;
    --chalk: #F3F0E4;
    --chalk-yellow: #FFE28A;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Noto Sans TC', sans-serif;
    background: var(--paper);
    background-image: repeating-linear-gradient(180deg, transparent 0 34px, var(--line) 34px 35px);
    min-height: 100vh;
    color: var(--ink);
    padding: 24px 16px 60px;
  }
  .wrap { max-width: 780px; margin: 0 auto; }
  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 18px;
    padding-bottom: 14px;
    border-bottom: 2px solid var(--ink);
  }
  .header-right {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .vmode-btn {
    background: var(--card);
    border: 2px solid var(--ink);
    border-radius: 20px;
    padding: 8px 18px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    color: var(--ink);
    font-family: 'Noto Sans TC', sans-serif;
  }
  .vmode-btn.active {
    background: var(--ink);
    color: var(--paper);
  }
  h1 {
    font-size: 46px;
    margin: 0;
    font-weight: 900;
  }
  h1 span.tag {
    font-family: 'Klee One', 'Noto Sans TC', sans-serif;
    color: var(--coral);
  }
  .updated { font-size: 15px; color: var(--ink-soft); }

  .tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 16px;
    overflow-x: auto;
    padding-bottom: 4px;
  }
  .tab {
    flex-shrink: 0;
    background: var(--card);
    border: 2px solid var(--line);
    border-bottom: none;
    border-radius: 10px 10px 0 0;
    padding: 12px 20px 10px;
    cursor: pointer;
    font-weight: 700;
    font-size: 19px;
    color: var(--ink-soft);
    position: relative;
    top: 2px;
  }
  .tab.active {
    color: var(--ink);
    border-color: var(--ink);
    background: var(--card);
    top: 0;
    box-shadow: 0 -2px 0 var(--coral) inset;
  }
  .tab .day-date { display: block; font-size: 15px; font-weight: 400; margin-top: 2px; }

  .day-panel { display: none; }
  .day-panel.active { display: block; animation: fade .25s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

  /* 黑板造型：木框 + 板面 */
  .card {
    background:
      radial-gradient(ellipse at 20% 15%, rgba(255,255,255,0.05), transparent 55%),
      radial-gradient(ellipse at 80% 85%, rgba(255,255,255,0.04), transparent 55%),
      linear-gradient(160deg, var(--board) 0%, var(--board-dark) 100%);
    border: 14px solid var(--wood);
    border-radius: 10px;
    box-shadow:
      inset 0 0 0 3px var(--wood-dark),
      inset 0 2px 14px rgba(0,0,0,0.5),
      0 10px 22px rgba(60,40,20,0.25);
    padding: 26px 24px;
    margin-bottom: 14px;
    color: var(--chalk);
  }
  .section { margin-bottom: 22px; }
  .section:last-child { margin-bottom: 0; }
  .section-label {
    font-size: 17px;
    font-weight: 700;
    color: var(--chalk-yellow);
    letter-spacing: 1px;
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 6px;
    text-shadow: 0 0 6px rgba(255,226,138,0.25);
  }
  .section-body {
    font-size: 28px;
    line-height: 2.5;
    white-space: pre-line;
    text-shadow: 0 0 3px rgba(255,255,255,0.15);
  }
  .section-body.empty { color: #B9C4BC; font-style: italic; text-shadow: none; }

  ruby { ruby-position: over; margin: 0 4px; }
  rt {
    font-size: 0.48em;
    color: var(--chalk-yellow);
    font-weight: 600;
    user-select: none;
    letter-spacing: 0;
  }
  body.no-zhuyin rt { display: none; }
  rt { display: none; }
  body.vmode ruby { ruby-position: right; margin: 3px 0; }

  .announce {
    background: rgba(255,226,138,0.12);
    border: 2px dashed var(--chalk-yellow);
    color: var(--chalk);
    border-radius: 10px;
    padding: 16px 18px;
    font-size: 21px;
    line-height: 1.7;
  }

  /* 直式抄寫模式 */
  body.vmode .card {
    writing-mode: vertical-rl;
    text-orientation: mixed;
    height: 65vh;
    max-height: 620px;
    width: 100%;
    overflow-x: auto;
    overflow-y: hidden;
    display: block;
  }
  body.vmode .section {
    margin-bottom: 0;
    margin-right: 30px;
    display: inline-block;
    vertical-align: top;
    height: 100%;
  }
  body.vmode .section-label {
    writing-mode: vertical-rl;
    margin-bottom: 0;
    margin-right: 8px;
  }
  body.vmode .section-body {
    font-size: 30px;
    line-height: 2.7;
    letter-spacing: 2px;
  }
  body.vmode .announce {
    writing-mode: vertical-rl;
    text-orientation: mixed;
    height: 220px;
  }
  .vmode-hint {
    display: none;
    text-align: center;
    font-size: 15px;
    color: var(--ink-soft);
    margin: -6px 0 12px;
  }
  body.vmode .vmode-hint { display: block; }

  footer {
    margin-top: 24px;
    text-align: center;
    font-size: 14px;
    color: var(--ink-soft);
  }

  @media (max-width: 480px) {
    .tab { padding: 10px 16px 8px; font-size: 17px; }
    h1 { font-size: 32px; }
    .section-body { font-size: 26px; }
    .card { padding: 20px 16px; border-width: 10px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>303<span class="tag"> 班級聯絡簿</span></h1>
    <div class="header-right">
      <button class="vmode-btn" id="vmodeBtn">✍️ 直式抄寫模式</button>
    </div>
  </header>

  <div class="tabs" id="tabs"></div>
  <div class="vmode-hint">👉 由右往左、由上往下閱讀，可左右滑動查看完整內容</div>
  <div id="panels"></div>

  <footer>由 303 導師 Sia 每日更新．內容如有異動以老師口頭/BAND公告為準</footer>
</div>

<script>
// ⚠️ 這是示範用的一週資料，實際使用時老師會逐日更新這裡的內容
const WEEK_NUMBER = 1;
const WEEK_DATA = [
  {
    label: '一', date: '8/31',
    homework: '預習L1\n數習4.5\n填寫聯絡簿2~4',
    exam: '',
    bring: '',
    reminder: '',
    announce: ''
  },
  {
    label: '二', date: '9/1',
    homework: 'L1甲本生字9個×3\n數習6.7',
    exam: '',
    bring: '',
    reminder: '',
    announce: ''
  },
  {
    label: '三', date: '9/2',
    homework: 'L1甲本(完)\n數習8.9',
    exam: '字音字形(　　)',
    bring: '',
    reminder: '',
    announce: ''
  },
  {
    label: '四', date: '9/3',
    homework: 'L1造詞\n數練1.2',
    exam: '成語(　　)',
    bring: '',
    reminder: '發下社團報名表',
    announce: ''
  },
  {
    label: '五', date: '9/4',
    homework: 'L1圈詞×2\n數習10.11',
    exam: '語句練習',
    bring: '',
    reminder: '',
    announce: ''
  },
];
const LAST_UPDATED = '2026/08/29 已準備第1週內容（尚未部署）';

const tabsEl = document.getElementById('tabs');
const panelsEl = document.getElementById('panels');
// （已移除頂部更新時間顯示）

function combinedList(d) {
  const items = [];
  [d.homework, d.exam, d.bring, d.reminder].forEach(field => {
    if (field && field.trim()) {
      field.split('\n').forEach(line => {
        if (line.trim()) items.push(line.trim());
      });
    }
  });

  if (items.length === 0) {
    return `<div class="section-body empty">今天沒有喔</div>`;
  }
  return `<div class="section-body">` +
    items.map((line, i) => `${i + 1}. ${line}`).join('\n\n') +
    `</div>`;
}

WEEK_DATA.forEach((d, i) => {
  const tab = document.createElement('div');
  tab.className = 'tab' + (i === 0 ? ' active' : '');
  tab.innerHTML = `週${d.label}<span class="day-date">W${WEEK_NUMBER}｜${d.date}</span>`;
  tab.onclick = () => switchDay(i);
  tabsEl.appendChild(tab);

  const panel = document.createElement('div');
  panel.className = 'day-panel' + (i === 0 ? ' active' : '');
  panel.innerHTML = `
    <div class="card">
      ${combinedList(d)}
    </div>
    ${d.announce && d.announce.trim() ? `<div class="announce">📣 ${d.announce}</div>` : ''}
  `;
  panelsEl.appendChild(panel);
});

function switchDay(idx) {
  document.querySelectorAll('.tab').forEach((t, i) => t.classList.toggle('active', i === idx));
  document.querySelectorAll('.day-panel').forEach((p, i) => p.classList.toggle('active', i === idx));
}

document.getElementById('vmodeBtn').onclick = (e) => {
  const on = document.body.classList.toggle('vmode');
  e.target.classList.toggle('active', on);
};


</script>
</body>
</html>
